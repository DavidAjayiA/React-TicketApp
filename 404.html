<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; URL=/React-TicketApp/#/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
  </head>
  <body>
    <p>Redirecting...</p>
    <script>
      const repoBase = '/React-TicketApp';
      const path = location.pathname;
      const relativePath = path.startsWith(repoBase) ? path.slice(repoBase.length) : path;
      const hashPath = relativePath.startsWith('/') ? '#'+relativePath : '#/'+relativePath;
      location.replace(repoBase + '/' + hashPath + location.search);
    </script>
  </body>
</html>
